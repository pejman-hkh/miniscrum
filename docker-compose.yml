version: "3"
services:
  nextjs1:
    build:
      context: .
      dockerfile: Dockerfile
    image: miniscrum/nextjs:latest
    container_name: miniscrum-nextjs
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - next-net
    volumes:
      - ./data:/prisma

  nginx:
    image: nginx:alpine
    container_name: miniscrum-nginx
    ports:
      - "480:80"
      - "4443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - next-net

networks:
  next-net:
